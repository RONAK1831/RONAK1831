<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="1200" height="360">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#05070d"/><stop offset=".5" stop-color="#07111c"/><stop offset="1" stop-color="#05070d"/>
  </linearGradient>
  <linearGradient id="name" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#fff"/><stop offset=".35" stop-color="#38bdf8"/><stop offset=".65" stop-color="#8b5cf6"/><stop offset="1" stop-color="#fff"/>
    <animate attributeName="x1" values="0;1;0" dur="5s" repeatCount="indefinite"/>
    <animate attributeName="x2" values="1;2;1" dur="5s" repeatCount="indefinite"/>
  </linearGradient>
  <radialGradient id="glow">
    <stop offset="0" stop-color="#38bdf8" stop-opacity=".18"/><stop offset="1" stop-color="#38bdf8" stop-opacity="0"/>
  </radialGradient>
  <pattern id="grid" width="45" height="45" patternUnits="userSpaceOnUse">
    <path d="M45 0H0V45" fill="none" stroke="#6482ff" stroke-opacity=".16"/>
  </pattern>
  <filter id="blur"><feGaussianBlur stdDeviation="22"/></filter>
  <filter id="blueGlow"><feGaussianBlur stdDeviation="5"/></filter>
</defs>

<rect width="1200" height="360" rx="18" fill="url(#bg)"/>
<ellipse cx="220" cy="120" rx="270" ry="190" fill="url(#glow)" filter="url(#blur)"/>
<ellipse cx="1000" cy="260" rx="270" ry="190" fill="#8b5cf6" fill-opacity=".07" filter="url(#blur)"/>
<rect width="1200" height="360" fill="url(#grid)">
  <animate attributeName="x" from="0" to="45" dur="12s" repeatCount="indefinite"/>
</rect>

<g fill="#fff" opacity=".65">
  <circle cx="90" cy="65" r="1.2"><animate attributeName="opacity" values=".2;1;.2" dur="2.4s" repeatCount="indefinite"/></circle>
  <circle cx="180" cy="285" r="1"><animate attributeName="opacity" values="1;.2;1" dur="3s" repeatCount="indefinite"/></circle>
  <circle cx="320" cy="75" r="1.3"><animate attributeName="opacity" values=".2;1;.2" dur="2.8s" repeatCount="indefinite"/></circle>
  <circle cx="920" cy="75" r="1"><animate attributeName="opacity" values="1;.2;1" dur="2.5s" repeatCount="indefinite"/></circle>
  <circle cx="1080" cy="135" r="1.2"><animate attributeName="opacity" values=".2;1;.2" dur="3.2s" repeatCount="indefinite"/></circle>
  <circle cx="1030" cy="300" r="1"><animate attributeName="opacity" values="1;.2;1" dur="2.7s" repeatCount="indefinite"/></circle>
</g>

<g transform="translate(1010 180)">
  <ellipse rx="145" ry="145" fill="none" stroke="#38bdf8" stroke-opacity=".18"/>
  <ellipse rx="90" ry="90" fill="none" stroke="#8b5cf6" stroke-opacity=".13"/>
  <circle cx="0" cy="-145" r="5" fill="#38bdf8" filter="url(#blueGlow)">
    <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="18s" repeatCount="indefinite"/>
  </circle>
</g>

<g text-anchor="middle" font-family="Arial, Helvetica, sans-serif">
  <text x="600" y="92" fill="#94a3b8" font-size="13" letter-spacing="6">HI THERE 👋</text>
  <text x="600" y="175" fill="#fff" font-size="76" font-weight="800" letter-spacing="-4">AMAN <tspan fill="url(#name)">HANSDAH</tspan></text>
  <text x="600" y="220" fill="#dbe4f0" font-size="19" letter-spacing="3">BTECH CSE <tspan fill="#38bdf8">|</tspan> AIML ASPIRANT</text>
  <text x="600" y="253" fill="#64748b" font-size="12" letter-spacing="3">LEARNING • BUILDING • GROWING</text>
</g>

<circle cx="600" cy="285" r="4" fill="#4ade80">
  <animate attributeName="r" values="4;7;4" dur="1.7s" repeatCount="indefinite"/>
  <animate attributeName="opacity" values="1;.5;1" dur="1.7s" repeatCount="indefinite"/>
</circle>

<text x="35" y="315" fill="#94a3b8" fill-opacity=".24" font-family="monospace" font-size="12">
  &lt;developer&gt; learn("AI + ML"); build("projects"); repeat(); &lt;/developer&gt;
</text>
</svg>