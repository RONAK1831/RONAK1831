<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Aman Hansdah - Animated GitHub Footer</title>

<style>
  * {
    box-sizing: border-box;
  }

  body {
    margin: 0;
    min-height: 100vh;
    background: #05070d;
    display: flex;
    align-items: flex-end;
    justify-content: center;
    padding: 30px;
    font-family: Inter, Arial, sans-serif;
  }

  .footer {
    position: relative;
    width: 100%;
    max-width: 1200px;
    min-height: 300px;
    overflow: hidden;
    padding: 65px 25px 30px;
    text-align: center;
    color: #fff;
    background:
      radial-gradient(circle at 50% 0%, rgba(139,92,246,.13), transparent 35%),
      radial-gradient(circle at 15% 70%, rgba(56,189,248,.08), transparent 25%),
      #05070d;
    border: 1px solid rgba(56,189,248,.25);
    border-radius: 18px;
    box-shadow: 0 0 50px rgba(56,189,248,.05);
  }

  /* Animated grid */
  .grid {
    position: absolute;
    inset: 0;
    opacity: .10;
    background-image:
      linear-gradient(rgba(100,130,255,.2) 1px, transparent 1px),
      linear-gradient(90deg, rgba(100,130,255,.2) 1px, transparent 1px);
    background-size: 42px 42px;
    animation: gridMove 14s linear infinite;
  }

  /* Animated waves */
  .wave,
  .wave.two {
    position: absolute;
    left: -10%;
    width: 120%;
    height: 100px;
    border-top: 1px solid rgba(56,189,248,.55);
    border-radius: 50%;
    pointer-events: none;
  }

  .wave {
    top: -52px;
    animation: waveMove 5s ease-in-out infinite;
  }

  .wave.two {
    top: -35px;
    border-color: rgba(139,92,246,.35);
    animation-delay: -2.2s;
  }

  /* Glow particles */
  .particle {
    position: absolute;
    width: 4px;
    height: 4px;
    border-radius: 50%;
    background: #38bdf8;
    box-shadow: 0 0 12px #38bdf8;
    opacity: .6;
    animation: float 4s ease-in-out infinite;
  }

  .p1 { left: 12%; top: 45%; animation-delay: -.5s; }
  .p2 { left: 22%; top: 25%; animation-delay: -2s; }
  .p3 { right: 18%; top: 35%; animation-delay: -1s; }
  .p4 { right: 10%; top: 65%; animation-delay: -3s; }

  .content {
    position: relative;
    z-index: 5;
    animation: fadeUp 1s ease both;
  }

  .eyebrow {
    margin: 0;
    color: #94a3b8;
    font-size: 12px;
    letter-spacing: 5px;
    text-transform: uppercase;
  }

  h2 {
    margin: 14px 0 0;
    font-size: clamp(24px, 4vw, 38px);
    font-weight: 600;
    letter-spacing: -1px;
  }

  h2 span {
    color: #38bdf8;
  }

  .links {
    display: flex;
    justify-content: center;
    flex-wrap: wrap;
    gap: 12px;
    margin-top: 27px;
  }

  .links a {
    color: #cbd5e1;
    text-decoration: none;
    border: 1px solid rgba(148,163,184,.2);
    border-radius: 999px;
    padding: 9px 17px;
    font-size: 12px;
    letter-spacing: 1px;
    transition: .25s ease;
    background: rgba(255,255,255,.015);
  }

  .links a:hover {
    color: #fff;
    border-color: #38bdf8;
    transform: translateY(-4px);
    box-shadow: 0 8px 25px rgba(56,189,248,.13);
  }

  .quote {
    margin: 30px 0 20px;
    color: #64748b;
    font-size: 11px;
    letter-spacing: 3px;
  }

  .line {
    width: min(620px, 80%);
    height: 1px;
    margin: 0 auto 17px;
    background: linear-gradient(
      90deg,
      transparent,
      rgba(56,189,248,.35),
      rgba(139,92,246,.35),
      transparent
    );
  }

  .copyright {
    color: #475569;
    font-size: 9px;
    letter-spacing: 2px;
  }

  @keyframes fadeUp {
    from {
      opacity: 0;
      transform: translateY(20px);
    }
    to {
      opacity: 1;
      transform: translateY(0);
    }
  }

  @keyframes waveMove {
    0%, 100% {
      transform: translateX(-2%) scaleY(1);
    }
    50% {
      transform: translateX(2%) scaleY(1.3);
    }
  }

  @keyframes gridMove {
    from {
      background-position: 0 0;
    }
    to {
      background-position: 42px 42px;
    }
  }

  @keyframes float {
    0%, 100% {
      transform: translateY(0) scale(1);
    }
    50% {
      transform: translateY(-18px) scale(1.5);
    }
  }

  @media (max-width: 600px) {
    body {
      padding: 12px;
    }

    .footer {
      min-height: 320px;
    }

    .links {
      gap: 8px;
    }

    .links a {
      padding: 8px 13px;
    }
  }

  @media (prefers-reduced-motion: reduce) {
    *,
    *::before,
    *::after {
      animation-duration: .01ms !important;
      animation-iteration-count: 1 !important;
    }
  }
</style>
</head>

<body>

  <footer class="footer">

    <div class="grid"></div>

    <div class="wave"></div>
    <div class="wave two"></div>

    <span class="particle p1"></span>
    <span class="particle p2"></span>
    <span class="particle p3"></span>
    <span class="particle p4"></span>

    <div class="content">

      <p class="eyebrow">Thanks for visiting ✦</p>

      <h2>
        Let's <span>connect</span> & build something amazing.
      </h2>

      <nav class="links" aria-label="Social links">
        <!-- Replace # with your actual profile URLs -->
        <a href="#" target="_blank">GitHub</a>
        <a href="#" target="_blank">LinkedIn</a>
        <a href="mailto:your@email.com">Email</a>
        <a href="#" target="_blank">Portfolio</a>
      </nav>

      <p class="quote">
        KEEP LEARNING · KEEP BUILDING · KEEP GOING
      </p>

      <div class="line"></div>

      <div class="copyright">
        © 2026 AMAN HANSDAH · BTECH CSE · AIML ASPIRANT
      </div>

    </div>

  </footer>

</body>
</html>
