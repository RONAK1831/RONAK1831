<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Aman Hansdah - Animated GitHub Header</title>

<style>
  * {
    box-sizing: border-box;
  }

  body {
    margin: 0;
    min-height: 100vh;
    background: #05070d;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 30px;
    font-family: Inter, Arial, sans-serif;
  }

  .header {
    position: relative;
    width: 100%;
    max-width: 1200px;
    min-height: 360px;
    overflow: hidden;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    color: #fff;
    background:
      radial-gradient(circle at 20% 30%, rgba(56,189,248,.13), transparent 25%),
      radial-gradient(circle at 80% 70%, rgba(139,92,246,.13), transparent 25%),
      #05070d;
    border: 1px solid rgba(56,189,248,.25);
    border-radius: 18px;
    box-shadow: 0 0 50px rgba(56,189,248,.05);
  }

  /* Animated grid */
  .grid {
    position: absolute;
    inset: 0;
    opacity: .15;
    background-image:
      linear-gradient(rgba(100,130,255,.25) 1px, transparent 1px),
      linear-gradient(90deg, rgba(100,130,255,.25) 1px, transparent 1px);
    background-size: 45px 45px;
    animation: gridMove 12s linear infinite;
  }

  /* Floating stars */
  .stars,
  .stars::before,
  .stars::after {
    position: absolute;
    inset: 0;
    content: "";
    background-image:
      radial-gradient(circle, rgba(255,255,255,.8) 1px, transparent 1.5px);
    background-size: 130px 130px;
  }

  .stars {
    opacity: .35;
    animation: starsMove 20s linear infinite;
  }

  .stars::before {
    background-size: 190px 190px;
    opacity: .5;
    animation: starsMove 30s linear infinite reverse;
  }

  .stars::after {
    background-size: 270px 270px;
    opacity: .3;
    animation: starsMove 40s linear infinite;
  }

  /* Glowing orbit */
  .orbit {
    position: absolute;
    width: 330px;
    height: 330px;
    right: 4%;
    top: 50%;
    transform: translateY(-50%);
    border: 1px solid rgba(56,189,248,.18);
    border-radius: 50%;
    animation: orbitRotate 18s linear infinite;
  }

  .orbit::before {
    content: "";
    position: absolute;
    width: 9px;
    height: 9px;
    top: 20px;
    left: 50%;
    border-radius: 50%;
    background: #38bdf8;
    box-shadow: 0 0 20px #38bdf8;
  }

  .orbit::after {
    content: "";
    position: absolute;
    width: 200px;
    height: 200px;
    top: 64px;
    left: 64px;
    border: 1px solid rgba(139,92,246,.12);
    border-radius: 50%;
  }

  .content {
    position: relative;
    z-index: 5;
    animation: fadeUp 1s ease both;
  }

  .eyebrow {
    margin: 0 0 15px;
    color: #94a3b8;
    font-size: 13px;
    letter-spacing: 5px;
    text-transform: uppercase;
  }

  h1 {
    margin: 0;
    font-size: clamp(42px, 8vw, 88px);
    line-height: .95;
    font-weight: 800;
    letter-spacing: -5px;
  }

  h1 span {
    background: linear-gradient(
      90deg,
      #ffffff,
      #38bdf8,
      #8b5cf6,
      #38bdf8,
      #ffffff
    );
    background-size: 300% auto;
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    animation: gradientMove 5s linear infinite;
  }

  .subtitle {
    margin: 25px 0 0;
    color: #dbe4f0;
    font-size: clamp(14px, 2vw, 19px);
    letter-spacing: 3px;
  }

  .subtitle strong {
    color: #38bdf8;
    font-weight: 600;
  }

  .tagline {
    margin: 17px 0 0;
    color: #64748b;
    font-size: 12px;
    letter-spacing: 3px;
  }

  .status {
    width: 8px;
    height: 8px;
    margin: 27px auto 0;
    border-radius: 50%;
    background: #4ade80;
    box-shadow: 0 0 18px #4ade80;
    animation: pulse 1.7s ease-in-out infinite;
  }

  .code {
    position: absolute;
    z-index: 2;
    right: 35px;
    bottom: 25px;
    color: rgba(148,163,184,.25);
    font: 12px/1.8 monospace;
    text-align: left;
    animation: float 5s ease-in-out infinite;
  }

  @keyframes fadeUp {
    from {
      opacity: 0;
      transform: translateY(25px);
    }
    to {
      opacity: 1;
      transform: translateY(0);
    }
  }

  @keyframes gradientMove {
    0% { background-position: 0% center; }
    100% { background-position: 300% center; }
  }

  @keyframes gridMove {
    from { background-position: 0 0; }
    to { background-position: 45px 45px; }
  }

  @keyframes starsMove {
    from { transform: translate(0, 0); }
    to { transform: translate(130px, 130px); }
  }

  @keyframes orbitRotate {
    from { transform: translateY(-50%) rotate(0deg); }
    to { transform: translateY(-50%) rotate(360deg); }
  }

  @keyframes pulse {
    0%, 100% {
      transform: scale(1);
      opacity: 1;
    }
    50% {
      transform: scale(1.8);
      opacity: .5;
    }
  }

  @keyframes float {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-10px); }
  }

  @media (max-width: 700px) {
    body {
      padding: 12px;
    }

    .header {
      min-height: 330px;
    }

    .orbit,
    .code {
      display: none;
    }

    h1 {
      letter-spacing: -3px;
    }

    .subtitle {
      line-height: 1.8;
    }
  }

  @media (prefers-reduced-motion: reduce) {
    *,
    *::before,
    *::after {
      animation-duration: .01ms !important;
      animation-iteration-count: 1 !important;
    }
  }
</style>
</head>

<body>

  <header class="header">

    <div class="grid"></div>
    <div class="stars"></div>
    <div class="orbit"></div>

    <div class="content">

      <p class="eyebrow">Hi there 👋</p>

      <h1>
        AMAN <span>HANSDAH</span>
      </h1>

      <p class="subtitle">
        BTECH CSE <strong>|</strong> AIML ASPIRANT
      </p>

      <p class="tagline">
        LEARNING • BUILDING • GROWING
      </p>

      <div class="status"></div>

    </div>

    <div class="code">
      &lt;developer&gt;<br>
      &nbsp;&nbsp;learn("AI + ML");<br>
      &nbsp;&nbsp;build("projects");<br>
      &nbsp;&nbsp;repeat();<br>
      &lt;/developer&gt;
    </div>

  </header>

</body>
</html>
